# T20 运行时提示词配置（按材料类型分组; 单组字段+quote 定位; 示例仅取 dev 事件）
prompts:
  vulnerability_advisory:
    version: "extract-1.0.0"
    field_groups: [["affected_version", "affected_status"], ["fix_status"]]
    require_quote_block_for_duplicates: true
  research_paper:
    version: "extract-1.0.0"
    field_groups: [["paper_mechanism"]]
    require_quote_block_for_duplicates: true
policies:
  few_shot_source: "benchmarks/dev"
  benchmark_events_excluded: true
  model_hypothesis_field: "model_hypothesis"
  unverified_on_failure: true
