x-backend: &backend
  image: ${DIANZI_BACKEND_IMAGE:-dianzi-backend:local}
  build:
    context: ../..
    dockerfile: infra/docker/backend.Dockerfile
    args:
      PYTHON_IMAGE: python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      UV_IMAGE: ghcr.io/astral-sh/uv@sha256:10902f58a1606787602f303954cea099626a4adb02acbac4c69920fe9d278f82
  environment: &backend-environment
    APP_ENV: ${APP_ENV:-development}
    DATA_MODE: live
    DATABASE_URL: ${COMPOSE_DATABASE_URL:?Inject the application PostgreSQL URL}
    REDIS_URL: ${COMPOSE_REDIS_URL:?Inject the authenticated Redis URL}
    OPENSEARCH_URL: ${OPENSEARCH_URL:-}
    ALLOWED_ORIGINS: ${COMPOSE_ALLOWED_ORIGINS:?Set exact frontend origins as JSON}
    RAW_CONTENT_DIRECTORY: /var/lib/ai-intel/raw
  networks: [private]
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  volumes: [raw_content:/var/lib/ai-intel/raw]

services:
  postgres:
    image: pgvector/pgvector@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    profiles: [core, app, worker, scheduler, frontend]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the dedicated database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set the dedicated database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Inject PostgreSQL credential}
    ports: ["127.0.0.1:${POSTGRES_PORT:?Set an exclusive PostgreSQL port}:5432"]
    networks: [private]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 18
    mem_limit: 512m
    cpus: 0.4
    pids_limit: 128

  redis:
    image: redis@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    profiles: [core, app, worker, scheduler, frontend]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Inject Redis credential}
    command: [/bin/sh, -ec, 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    ports: ["127.0.0.1:${REDIS_PORT:?Set an exclusive Redis port}:6379"]
    networks: [private]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -x PONG']
      interval: 5s
      timeout: 3s
      retries: 18
    mem_limit: 128m
    cpus: 0.1
    pids_limit: 64

  opensearch:
    image: opensearchproject/opensearch@sha256:7b9517dff561f54456fad947f11820fa595a340fd1034fc63d57b77f724b3f8f
    profiles: [search]
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Inject search credential}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      node.store.allow_mmap: "false"
    ports: ["127.0.0.1:${OPENSEARCH_PORT:?Set an exclusive search port}:9200"]
    networks: [private]
    volumes: [opensearch_data:/usr/share/opensearch/data]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsSk -u "admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}" https://localhost:9200/_cluster/health >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    mem_limit: 2g
    cpus: 0.5
    pids_limit: 256

  api:
    <<: *backend
    profiles: [app, frontend]
    command: [uvicorn, ai_intel.api.app:app, --host, 0.0.0.0, --port, "8000"]
    ports: ["127.0.0.1:${API_PORT:?Set an exclusive API port}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/v1/health/ready", timeout=5)']
      interval: 10s
      timeout: 6s
      retries: 6
    mem_limit: 384m
    cpus: 0.25
    pids_limit: 128

  worker:
    <<: *backend
    profiles: [worker, scheduler]
    command: [celery, -A, ai_intel.workers.runtime:celery_app, worker, --concurrency=1]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'celery -A ai_intel.workers.runtime:celery_app inspect ping --destination "celery@$${HOSTNAME}" --timeout 5']
      interval: 15s
      timeout: 8s
      retries: 6
    mem_limit: 384m
    cpus: 0.25
    pids_limit: 128

  scheduler:
    <<: *backend
    profiles: [scheduler]
    command: [celery, -A, ai_intel.workers.runtime:celery_app, beat, --schedule=/tmp/celerybeat-schedule, --pidfile=/tmp/celerybeat.pid]
    depends_on:
      worker: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import os,pathlib; os.kill(int(pathlib.Path("/tmp/celerybeat.pid").read_text()),0)']
      interval: 15s
      timeout: 3s
      retries: 6
    mem_limit: 128m
    cpus: 0.1
    pids_limit: 64

  frontend:
    image: ${DIANZI_FRONTEND_IMAGE:-dianzi-frontend:local}
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        NODE_IMAGE: node@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    profiles: [frontend]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set the browser reachable API URL}
    command: [npm, run, dev, --, --host, 0.0.0.0, --port, "5173", --strictPort]
    ports: ["127.0.0.1:${FRONTEND_PORT:?Set an exclusive frontend port}:5173"]
    networks: [private]
    depends_on:
      api: {condition: service_healthy}
    init: true
    read_only: true
    tmpfs: [/tmp, /app/node_modules/.vite, /app/node_modules/.vite-temp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:5173/").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128

networks:
  private:
    internal: true

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  raw_content:
