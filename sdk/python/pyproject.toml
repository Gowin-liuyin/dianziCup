[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intel-client"
version = "0.1.0"
description = "Typed Python client and CLI for the AI security intelligence public API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
mcp = [
    "mcp==2.3.0",
    "tiktoken==0.14.0",
]

[project.scripts]
dianzi-intel = "ai_intel_client.cli:main"

[tool.setuptools]
packages = ["ai_intel_client"]
include-package-data = false

[tool.setuptools.package-data]
ai_intel_client = ["py.typed"]
